<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Claims Approval</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <h1>Claims Approval</h1>
        <p class="tagline">Submit insurance claims and review them</p>
      </div>
      <div class="identity">
        <label for="user-select">Acting as</label>
        <select id="user-select"></select>
      </div>
    </div>
  </header>

  <main class="container">
    <p class="demo-note">
      <strong>Demo identity, no real login.</strong>
      The user you pick is sent as the <code>X-User-Id</code> and <code>X-User-Role</code> headers.
      <a href="swagger-ui.html">API documentation</a>
    </p>

    <div id="banner" class="banner" aria-live="polite" hidden>
      <span id="banner-text"></span>
      <button type="button" id="banner-close" class="banner-close" aria-label="Dismiss message">&times;</button>
    </div>

    <section class="card" aria-labelledby="claims-heading">
      <div class="card-header">
        <h2 id="claims-heading">Claims</h2>
        <div class="filters">
          <label for="status-filter">Status</label>
          <select id="status-filter">
            <option value="">All</option>
            <option value="DRAFT">Draft</option>
            <option value="SUBMITTED">Submitted</option>
            <option value="APPROVED">Approved</option>
            <option value="REJECTED">Rejected</option>
          </select>
          <button type="button" id="refresh-btn" class="btn btn-secondary">Refresh</button>
        </div>
      </div>
      <p id="scope-note" class="muted small scope-note"></p>

      <div class="table-wrap">
        <table class="claims-table">
          <thead>
            <tr>
              <th scope="col">ID</th>
              <th scope="col">Title</th>
              <th scope="col" class="num">Amount</th>
              <th scope="col">Status</th>
              <th scope="col">Submitter</th>
              <th scope="col">Approver</th>
              <th scope="col">Updated</th>
            </tr>
          </thead>
          <tbody id="claims-body"></tbody>
        </table>
      </div>
      <p id="claims-empty" class="empty" hidden></p>

      <nav id="pager" class="pager" aria-label="Claims pages" hidden>
        <button type="button" id="prev-btn" class="btn btn-secondary">Previous</button>
        <span id="page-info" class="muted small"></span>
        <button type="button" id="next-btn" class="btn btn-secondary">Next</button>
      </nav>
    </section>
  </main>
</body>
</html>
