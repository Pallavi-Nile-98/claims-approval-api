name: CI

on:
  push:
  pull_request:

# Least privilege: the workflow's GITHUB_TOKEN can only read the repository.
permissions:
  contents: read

# A newer push to the same branch cancels the run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest   # has Docker preinstalled, which Testcontainers needs
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven       # reuse downloaded dependencies between runs

      # Unit tests (Surefire) then integration tests against real PostgreSQL (Failsafe).
      - name: Build and test
        run: ./mvnw -B verify

      # Only on failure: keep the reports so the cause can be read without re-running.
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          retention-days: 7
